<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, textarea, input, select, table, td, th, div {
            direction: rtl !important;

</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col" dir="rtl">

    <!-- Header -->

        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-xl font-bold">ط</div>
            <div>
                <h1 class="font-bold text-lg">لوحة التحكم وإدارة المحتوى</h1>
                <p class="text-xs text-slate-500">استيراد ملفات Word و PDF مع دعم اتجاه RTL الكامل</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <a href="index.html" target="_blank" class="bg-slate-100 dark:bg-slate-700 px-4 py-2 rounded-xl text-sm font-medium hover:bg-slate-200 transition"><i class="fa-solid fa-globe ml-1"></i> استعراض المنصة</a>
            <button onclick="exportJSON()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition"><i class="fa-solid fa-download ml-1"></i> تصدير Backup</button>
            <label class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium cursor-pointer transition">
                <i class="fa-solid fa-upload ml-1"></i> استيراد Restore
                <input type="file" accept=".json" onchange="importJSON(event)" class="hidden">
            </label>
        </div>
    </header>

    <!-- Main Admin Body -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full grid grid-cols-1 lg:grid-cols-4 gap-8" dir="rtl">
        
        <!-- Sidebar Controls -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-6 h-fit">
            <h3 class="font-bold text-lg border-b pb-3 border-slate-100 dark:border-slate-700">شجرة المحتوى الإدارية</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">اختر الصف</label>
                    <select id="admin-grade-select" onchange="renderAdminBooks()" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">اختر الكتاب</label>
                    <select id="admin-book-select" onchange="renderAdminUnits()" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></select>
                </div>
            </div>
            <div class="pt-4 border-t border-slate-100 dark:border-slate-700 space-y-2">
                <button onclick="openAddUnitModal()" class="w-full bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 font-medium py-2.5 rounded-xl text-sm hover:bg-indigo-100 transition"><i class="fa-solid fa-plus ml-1"></i> إضافة وحدة جديدة</button>
            </div>
        </div>

        <!-- Content Management Panel -->
        <div class="lg:col-span-3 space-y-6">
            <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-6">
                <h2 class="text-xl font-bold text-indigo-600">إدارة الوحدات والدروس والتمارين</h2>
                <div id="admin-units-container" class="space-y-6"></div>
            </div>

            <!-- Advanced Word & PDF Import Panel -->
            <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-6">
                <h3 class="text-lg font-bold text-indigo-600"><i class="fa-solid fa-file-arrow-up ml-2 text-blue-600"></i> محرر الدروس ورفع ملفات (Word .docx أو PDF)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center bg-slate-50 dark:bg-slate-700/50 p-4 rounded-2xl">
                    <div>
                        <label class="block text-sm font-semibold mb-1">اختر ملف الدرس (يدعم Word أو PDF تلقائياً)</label>
                        <input type="file" accept=".docx,.pdf" onchange="handleFile годомUpload(event)" id="lesson-file-input" class="text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">اختر الوحدة لإضافة الدرس</label>
                        <select id="target-unit-select" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm"></select>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">عنوان الدرس</label>
                        <input type="text" id="new-lesson-title" placeholder="مثال: عنوان الدرس المستورد" class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-sm font-medium">محتوى الدرس المستخرج (قابل للتعديل المباشر ومعاينة MathJax)</label>
                            <button type="button" onclick="previewMathContent()" class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1 rounded-lg font-semibold hover:bg-indigo-100 transition"><i class="fa-solid fa-eye ml-1"></i> معاينة فورية</button>
                        </div>
                        <textarea id="new-lesson-content" rows="10" placeholder="محتوى الشرح..." class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-right" dir="rtl"></textarea>
                    </div>

                    <div class="p-4 bg-indigo-50/50 dark:bg-slate-700/30 rounded-2xl border border-indigo-100 dark:border-slate-700 space-y-2">
                        <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400">معاينة مباشرة:</span>
                        <div id="live-math-preview" class="p-3 bg-white dark:bg-slate-800 rounded-xl min-h-[50px] text-sm" dir="rtl" style="text-align: right; direction: rtl;">اكتب محتوى بالأعلى واضغط معاينة...</div>
                    </div>

                    <button onclick="saveNewLesson()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl text-sm font-medium transition shadow-sm"><i class="fa-solid fa-floppy-disk ml-1"></i> حفظ الدرس وإضافته للمنصة</button>
                </div>
            </div>

    <!-- Modal: Add Unit -->
    <div id="unit-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" dir="rtl">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold">إضافة وحدة دراسية جديدة</h3>
            <input type="text" id="unit-name-input" placeholder="اسم الوحدة" class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none">
            <div class="flex justify-end gap-3">
                <button onclick="closeAddUnitModal()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-sm">إلغاء</button>
                <button onclick="confirmAddUnit()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-medium">حفظ الوحدة</button>
            </div>
        </div>
    </div>

    <!-- Modal: Add Exercise -->
    <div id="exercise-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" dir="rtl">
        <div class="bg-white dark:bg-slate-800 w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-emerald-600">إضافة تمرين تفاعلي للدرس</h3>
            <input type="hidden" id="ex-grade-id">
            <input type="hidden" id="ex-book-id">
            <input type="hidden" id="ex-unit-id">
            <input type="hidden" id="ex-lesson-id">
            <div>
                <label class="block text-sm font-medium mb-1">نص السؤال</label>
                <input type="text" id="ex-question" placeholder="السؤال" class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="ex-opt0" placeholder="الخيار الأول" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm">
                <input type="text" id="ex-opt1" placeholder="الخيار الثاني" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm">
                <input type="text" id="ex-opt2" placeholder="الخيار الثالث" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm">
                <input type="text" id="ex-opt3" placeholder="الخيار الرابع" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">الإجابة الصحيحة</label>
                <select id="ex-correct" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm">
                    <option value="0">الخيار الأول</option>
                    <option value="1">الخيار الثاني</option>
                    <option value="2">الخيار الثالث</option>
                    <option value="3">الخيار الرابع</option>
                </select>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button onclick="closeExerciseModal()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-sm">إلغاء</button>
                <button onclick="saveLessonExercise()" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-sm font-medium">حفظ التمرين</button>
            </div>
        </div>
    </div>

    <!-- Admin Logic Script -->
    <script>
        const defaultData = {
            grades: [
                {
                    id: 'g7',
                    name: 'الصف السابع',
                    books: [
                        {
                            id: 'b7_algebra',
                            name: 'كتاب الجبر',
                            units: [
                                {
                                    id: 'u7_1',
                                    name: 'الوحدة الأولى',
                                    lessons: [
                                        {
                                            id: 'l7_1_1',
                                            title: 'درس نموذجي',
                                            content: `<div dir="rtl" style="text-align: right; direction: rtl;"><h3>محتوى تجريبي</h3></div>`,
                                            exercises: []
                                        }
                                    ]
                                }
                            ]
                        },
                        { id: 'b7_geometry', name: 'كتاب الهندسة', units: [] }
                    ]
                },
                {
                    id: 'g8',
                    name: 'الصف الثامن',
                    books: [
                        { id: 'b8_alg', name: 'كتاب الجبر', units: [] },
                        { id: 'b8_geo', name: 'كتاب الهندسة', units: [] }
                    ]
                },
                {
                    id: 'g9',
                    name: 'الصف التاسع',
                    books: [
                        { id: 'b9_alg', name: 'كتاب الجبر', units: [] },
                        { id: 'b9_geo', name: 'كتاب الهندسة', units: [] }
                    ]
                }
            ]
        };

        let appData = JSON.parse(localStorage.getItem('taha_math_platform_data'));
        if (!appData || !appData.grades) {
            appData = defaultData;
            localStorage.setItem('taha_math_platform_data', JSON.stringify(appData));
        }

        function initAdmin() {
            let gradeSelect = document.getElementById('admin-grade-select');
            gradeSelect.innerHTML = '';
            appData.grades.forEach(g => {
                gradeSelect.innerHTML += `<option value="${g.id}">${g.name}</option>`;
            });
            renderAdminBooks();
        }

        function renderAdminBooks() {
            let gradeId = document.getElementById('admin-grade-select').value;
            let grade = appData.grades.find(g => g.id === gradeId);
            let bookSelect = document.getElementById('admin-book-select');
            bookSelect.innerHTML = '';
            if (grade && grade.books) {
                grade.books.forEach(b => {
                    bookSelect.innerHTML += `<option value="${b.id}">${b.name}</option>`;
                });
            }
            renderAdminUnits();
        }

        function renderAdminUnits() {
            let gradeId = document.getElementById('admin-grade-select').value;
            let bookId = document.getElementById('admin-book-select').value;
            let grade = appData.grades.find(g => g.id === gradeId);
            if (!grade) return;
            let book = grade.books.find(b => b.id === bookId);
            if (!book) return;

            let targetSelect = document.getElementById('target-unit-select');
            targetSelect.innerHTML = '';
            let container = document.getElementById('admin-units-container');
            container.innerHTML = '';

            if (!book.units || book.units.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-500">لا توجد وحدات.</p>`;
                return;
            }

            book.units.forEach(unit => {
                targetSelect.innerHTML += `<option value="${unit.id}">${unit.name}</option>`;
                let div = document.createElement('div');
                div.className = 'p-6 bg-slate-50 dark:bg-slate-700/40 rounded-2xl space-y-4';
                div.innerHTML = `
                    <div class="flex justify-between items-center" dir="rtl">
                        <h4 class="font-bold text-indigo-600 dark:text-indigo-400">${unit.name}</h4>
                        <button onclick="deleteUnit('${gradeId}', '${bookId}', '${unit.id}')" class="text-rose-500 text-xs hover:underline"><i class="fa-solid fa-trash ml-1"></i> حذف الوحدة</button>
                    </div>
                    <div class="space-y-3 pl-4" dir="rtl">
                `;
                if (unit.lessons && unit.lessons.length > 0) {
                    unit.lessons.forEach(l => {
                        let exCount = l.exercises ? l.exercises.length : 0;
                        div.innerHTML += `
                            <div class="p-4 bg-white dark:bg-slate-800 rounded-xl space-y-2 border border-slate-200 dark:border-slate-700" dir="rtl">
                                <div class="flex justify-between items-center" dir="rtl">
                                    <span class="font-bold text-sm"><i class="fa-solid fa-file-lines ml-2 text-indigo-500"></i>${l.title}</span>
                                    <div class="flex items-center gap-3">
                                        <button onclick="openExerciseModal('${gradeId}', '${bookId}', '${unit.id}', '${l.id}')" class="bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-emerald-100 transition"><i class="fa-solid fa-plus ml-1"></i> تمارين (${exCount})</button>
                                        <button onclick="deleteLesson('${gradeId}', '${bookId}', '${unit.id}', '${l.id}')" class="text-rose-500 hover:text-rose-700 text-xs"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    div.innerHTML += `<p class="text-xs text-slate-400">لا دروس مضافة بعد.</p>`;
                }
                div.innerHTML += `</div>`;
                container.appendChild(div);
            });
        }

        function openAddUnitModal() { document.getElementById('unit-modal').classList.remove('hidden'); }
        function closeAddUnitModal() { document.getElementById('unit-modal').classList.add('hidden'); }
        
        function confirmAddUnit() {
            let name = document.getElementById('unit-name-input').value;
            if (!name) return alert('أدخل اسم الوحدة');
            let gradeId = document.getElementById('admin-grade-select').value;
            let bookId = document.getElementById('admin-book-select').value;
            let grade = appData.grades.find(g => g.id === gradeId);
            let book = grade.books.find(b => b.id === bookId);
            if (!book.units) book.units = [];
            book.units.push({ id: 'u_' + Date.now(), name: name, lessons: [] });
            localStorage.setItem('taha_math_platform_data', JSON.stringify(appData));
            closeAddUnitModal();
            document.getElementById('unit-name-input').value = '';
            renderAdminUnits();
            alert('تمت إضافة الوحدة بنجاح!');
        }

        function deleteUnit(gradeId, bookId, unitId) {
            if (!confirm('حذف هذه الوحدة؟')) return;
            let book = appData.grades.find(g => g.id === gradeId).books.find(b => b.id === bookId);
            book.units = book.units.filter(u => u.id !== unitId);
            localStorage.setItem('taha_math_platform_data', JSON.stringify(appData));
            renderAdminUnits();
        }

        function deleteLesson(gradeId, bookId, unitId, lessonId) {
            if (!confirm('حذف هذا الدرس؟')) return;
            let unit = appData.grades.find(g => g.id === gradeId).books.find(b => b.id === bookId).units.find(u => u.id === unitId);
            unit.lessons = unit.lessons.filter(l => l.id !== lessonId);
            localStorage.setItem('taha_math_platform_data', JSON.stringify(appData));
            renderAdminUnits();
        }

        function saveNewLesson() {
            let unitId = document.getElementById('target-unit-select').value;
            let title = document.getElementById('new-lesson-title').value;
            let content = document.getElementById('new-lesson-content').value;

            if (!unitId || !title || !content) {
                alert('الرجاء التأكد من تعبئة العنوان والمحتوى واختيار الوحدة.');
                return;
            }

            let gradeId = document.getElementById('admin-grade-select').value;
            let bookId = document.getElementById('admin-book-select').value;
            let book = appData.grades.find(g => g.id === gradeId).books.find(b => b.id === bookId);
            let unit = book.units.find(u => u.id === unitId);

            if (!unit.lessons) unit.lessons = [];
            unit.lessons.push({
                id: 'l_' + Date.now(),
                title: title,
                content: `<div dir="rtl" style="text-align: right; direction: rtl;">${content}</div>`,
                exercises: []
            });

            localStorage.setItem('taha_math_platform_data', JSON.stringify(appData));
            document.getElementById('new-lesson-title').value = '';
            document.getElementById('new-lesson-content').value = '';
            document.getElementById('live-math-preview').innerHTML = 'تم الحفظ!';
            renderAdminUnits();
            alert('تم حفظ الدرس بنجاح!');
        }

        function openExerciseModal(gradeId, bookId, unitId, lessonId) {
            document.getElementById('ex-grade-id').value = gradeId;
            document.getElementById('ex-book-id').value = bookId;
            document.getElementById('ex-unit-id').value = unitId;
            document.getElementById('ex-lesson-id').value = lessonId;
            document.getElementById('exercise-modal').classList.remove('hidden');
        }
        function closeExerciseModal() { document.getElementById('exercise-modal').classList.add('hidden'); }
        
        function saveLessonExercise() {
            let gId = document.getElementById('ex-grade-id').value;
            let bId = document.getElementById('ex-book-id').value;
            let uId = document.getElementById('ex-unit-id').value;
            let lId = document.getElementById('ex-lesson-id').value;

            let question = document.getElementById('ex-question').value;
            let opt0 = document.getElementById('ex-opt0').value;
            let opt1 = document.getElementById('ex-opt1').value;
            let opt2 = document.getElementById('ex-opt2').value;
            let opt3 = document.getElementById('ex-opt3').value;
            let correct = parseInt(document.getElementById('ex-correct').value);

            if (!question || !opt0 || !opt1) {
                alert('أدخل السؤال وخيارين على الأقل.');
                return;
            }

            let unit = appData.grades.find(g => g.id === gId).books.find(b => b.id === bId).units.find(u => u.id === uId);
            let lesson = unit.lessons.find(l => l.id === lId);

            if (!lesson.exercises) lesson.exercises = [];
            lesson.exercises.push({
                question: question,
                options: [opt0, opt1, opt2, opt3].filter(o => o.trim() !== ''),
                correct: correct
            });

            localStorage.setItem('taha_math_platform_data', JSON.stringify(appData));
            closeExerciseModal();
            document.getElementById('ex-question').value = '';
            document.getElementById('ex-opt0').value = '';
            document.getElementById('ex-opt1').value = '';
            document.getElementById('ex-opt2').value = '';
            document.getElementById('ex-opt3').value = '';
            renderAdminUnits();
            alert('تمت إضافة التمرين بنجاح!');
        }

        function previewMathContent() {
            let val = document.getElementById('new-lesson-content').value;
            let preview = document.getElementById('live-math-preview');
            preview.innerHTML = `<div dir="rtl" style="text-align: right; direction: rtl;">${val}</div>`;
            if (window.MathJax) { MathJax.typesetPromise([preview]); }
        }

        /* --- محول OMML إلى LaTeX المطور للأسس والكسور والجذور والألوان --- */
        function convertOmmlToLatex(ommlNode) {
            try {
                function parse(node) {
                    if (!node) return "";
                    let latex = "";
                    for (let child of node.childNodes) {
                        let name = child.localName;
                        if (!name) {
                            if (child.nodeType === 3) latex += child.nodeValue;
                            continue;
                        }
                        if (name === 'r' || name === 't') {
                            latex += child.textContent;
                        } 
                        else if (name === 'f') { // كسر
                            let num = parse(child.getElementsByTagNameNS("*", "num")[0]);
                            let den = parse(child.getElementsByTagNameNS("*", "den")[0]);
                            latex += `\\frac{${num}}{${den}}`;
                        } 
                        else if (name === 'rad') { // جذر
                            let deg = child.getElementsByTagNameNS("*", "deg")[0];
                            let e = child.getElementsByTagNameNS("*", "e")[0];
                            let degText = deg ? parse(deg) : "";
                            let eText = parse(e);
                            if (degText && degText.trim() !== "2") {
                                latex += `\\sqrt[${degText}]{${eText}}`;
                            } else {
                                latex += `\\sqrt{${eText}}`;
                            }
                        } 
                        else if (name === 'sup') { // أسس
                            let e = parse(child.getElementsByTagNameNS("*", "e")[0]);
                            let sup = parse(child.getElementsByTagNameNS("*", "sup")[0]);
                            latex += `{${e}}^{${sup}}`;
                        } 
                        else if (name === 'sub') { // دليل سفلي
                            let e = parse(child.getElementsByTagNameNS("*", "e")[0]);
                            let sub = parse(child.getElementsByTagNameNS("*", "sub")[0]);
                            latex += `{${e}}_{${sub}}`;
                        }
                        else if (name === 'd') { // أقواس
                            let b = parse(child.getElementsByTagNameNS("*", "begChr")[0] || {textContent: "("});
                            let en = parse(child.getElementsByTagNameNS("*", "endChr")[0] || {textContent: ")"});
                            let eNodes = child.getElementsByTagNameNS("*", "e");
                            let eTexts = [];
                            for(let enode of eNodes) eTexts.push(parse(enode));
                            latex += `\\left${b || '('} ${eTexts.join(' ')} \\right${en || ')'}`;
                        }
                        else if (name === 'm') { // مصفوفة
                            let rows = [];
                            let mRows = child.getElementsByTagNameNS("*", "mr");
                            for (let r of mRows) {
                                let cols = [];
                                for (let el of r.getElementsByTagNameNS("*", "e")) {
                                    cols.push(parse(el));
                                }
                                rows.push(cols.join(" & "));
                            }
                            latex += `\\begin{matrix} ${rows.join(" \\\\ ")} \\end{matrix}`;
                        }
                        else {
                            latex += parse(child);
                        }
                    }
                    return latex;
                }

                let res = parse(ommlNode);
                return res
                    .replace(/alpha/g, '\\alpha')
                    .replace(/beta/g, '\\beta')
                    .replace(/pi/g, '\\pi')
                    .replace(/theta/g, '\\theta')
                    .replace(/sin/g, '\\sin')
                    .replace(/cos/g, '\\cos')
                    .replace(/tan/g, '\\tan')
                    .replace(/to/g, '\\to')
                    .replace(/implies/g, '\\implies')
                    .replace(/le/g, '\\le')
                    .replace(/ge/g, '\\ge')
                    .replace(/ne/g, '\\ne')
                    .replace(/pm/g, '\\pm')
                    .replace(/inf/g, '\\infty')
                    .replace(/times/g, '\\times')
                    .replace(/div/g, '\\div');
            } catch (e) {
                return null;
            }
        }

        // دالة SVG بديلة عند تعذر التحويل
        function createSvgFallback(eqText) {
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("xmlns", svgNS);
            svg.setAttribute("width", Math.max(80, eqText.length * 9));
            svg.setAttribute("height", "28");
            
            const rect = document.createElementNS(svgNS, "rect");
            rect.setAttribute("width", "100%");
            rect.setAttribute("height", "100%");
            rect.setAttribute("fill", "#f1f5f9");
            rect.setAttribute("rx", "4");
            svg.appendChild(rect);

            const text = document.createElementNS(svgNS, "text");
            text.setAttribute("x", "8");
            text.setAttribute("y", "19");
            text.setAttribute("fill", "#1e293b");
            text.setAttribute("font-family", "Arial, sans-serif");
            text.setAttribute("font-size", "13px");
            text.textContent = eqText;
            svg.appendChild(text);

            let s = new XMLSerializer();
            return `data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(s.serializeToString(svg))))}`;
        }

        /* --- دالة معالجة الملفات الموحدة (تدعم Word .docx و PDF .pdf معاً) --- */
        async function handleFile годомUpload(e) {
            let file = e.target.files[0];
            if (!file) return;

            let fileName = file.name.toLowerCase();

            if (fileName.endsWith('.docx')) {
                await handleDocxUpload(file);
            } else if (fileName.endsWith('.pdf')) {
                await handlePdfUpload(file);
            } else {
                alert('الرجاء اختيار ملف بصيغة Word (.docx) أو PDF (.pdf) فقط.');
            }
        }

        // معالجة ملفات Word .docx
        async function handleDocxUpload(file) {
            try {
                let arrayBuffer = await file.arrayBuffer();
                let zip = new JSZip();
                let zipContent = await zip.loadAsync(arrayBuffer);

                let imagesBase64 = {};
                let mediaFiles = zipContent.folder("word/media");
                if (mediaFiles) {
                    for (let relativePath in mediaFiles.files) {
                        let imgFile = mediaFiles.files[relativePath];
                        if (!imgFile.dir) {
                            let imgData = await imgFile.async("base64");
                            let ext = relativePath.split('.').pop().toLowerCase();
                            let mime = ext === 'png' ? 'image/png' : (ext === 'jpeg' || ext === 'jpg' ? 'image/jpeg' : 'image/png');
                            imagesBase64[relativePath.replace('word/', '')] = `data:${mime};base64,${imgData}`;
                        }
                    }
                }

                let relsMap = {};
                let relsFile = zipContent.file("word/_rels/document.xml.rels");
                if (relsFile) {
                    let relsText = await relsFile.async("text");
                    let relsDoc = new DOMParser().parseFromString(relsText, "text/xml");
                    let relationships = relsDoc.getElementsByTagName("Relationship");
                    for (let rel of relationships) {
                        let id = rel.getAttribute("Id");
                        let target = rel.getAttribute("Target");
                        if (target.startsWith("media/")) {
                            relsMap[id] = "media/" + target.split("/").pop();
                        }
                    }
                }

                let docXmlFile = zipContent.file("word/document.xml");
                if (!docXmlFile) {
                    alert('ملف Word غير صالح.');
                    return;
                }

                let docXmlText = await docXmlFile.async("text");
                let xmlDoc = new DOMParser().parseFromString(docXmlText, "text/xml");

                let bodyNode = xmlDoc.getElementsByTagNameNS("*", "body")[0];
                if (!bodyNode) {
                    alert('لم يتم العثور على محتوى النص.');
                    return;
                }

                let finalHtml = "";

                function parseParagraphContent(paragraphNode) {
                    let pContent = "";
                    for (let pChild of paragraphNode.childNodes) {
                        if (pChild.localName === 'r') {
                            let rPr = pChild.getElementsByTagNameNS("*", "rPr")[0];
                            let textColorStyle = "";
                            if (rPr) {
                                let colorNode = rPr.getElementsByTagNameNS("*", "color")[0];
                                if (colorNode) {
                                    let val = colorNode.getAttribute("w:val") || colorNode.getAttribute("val");
                                    if (val && val !== 'auto' && val !== '000000') {
                                        textColorStyle = `color: #${val};`;
                                    }
                                }
                            }

                            let tNodes = pChild.getElementsByTagNameNS("*", "t");
                            let rText = "";
                            for (let t of tNodes) {
                                if (t.textContent) rText += t.textContent;
                            }

                            if (rText) {
                                if (textColorStyle) {
                                    pContent += `<span style="${textColorStyle}">${rText}</span>`;
                                } else {
                                    pContent += rText;
                                }
                            }

                            let blipNodes = pChild.getElementsByTagNameNS("*", "blip");
                            for (let blip of blipNodes) {
                                let embedId = blip.getAttribute("r:embed") || blip.getAttribute("embed");
                                if (embedId && relsMap[embedId]) {
                                    let imgKey = relsMap[embedId];
                                    if (imagesBase64[imgKey]) {
                                        pContent += ` <img src="${imagesBase64[imgKey]}" alt="Image" style="max-width:100%; height:auto; display:inline-block; margin: 10px auto; border-radius: 8px;" /> `;
                                    }
                                }
                            }

                            let mathNodes = pChild.getElementsByTagNameNS("*", "oMath");
                            for (let m of mathNodes) {
                                let latex = convertOmmlToLatex(m);
                                if (latex && latex.trim().length > 0) {
                                    pContent += ` $${latex}$ `;
                                } else {
                                    let rawText = m.textContent || "معادلة";
                                    let svgUri = createSvgFallback(rawText);
                                    pContent += ` <img src="${svgUri}" alt="math" style="display:inline-block; vertical-align:middle; margin:0 3px;" /> `;
                                }
                            }
                        } 
                        else if (pChild.localName === 'oMath') {
                            let latex = convertOmmlToLatex(pChild);
                            if (latex && latex.trim().length > 0) {
                                pContent += ` $${latex}$ `;
                            } else {
                                let rawText = pChild.textContent || "معادلة";
                                let svgUri = createSvgFallback(rawText);
                                pContent += ` <img src="${svgUri}" alt="math" style="display:inline-block; vertical-align:middle; margin:0 3px;" /> `;
                            }
                        }
                    }
                    return pContent;
                }

                for (let child of bodyNode.childNodes) {
                    let nodeName = child.localName;

                    if (nodeName === 'p') {
                        let pContent = parseParagraphContent(child);
                        if (pContent.trim() !== "") {
                            finalHtml += `<p dir="rtl" style="margin-bottom: 12px; text-align: right; direction: rtl;">${pContent}</p>`;
                        } else {
                            finalHtml += `<br>`;
                        }
                    } 
                    else if (nodeName === 'tbl') {
                        let tableHtml = `<table dir="rtl" style="width:100%; border-collapse: collapse; margin: 15px 0; border: 1px solid #cbd5e1; direction: rtl; text-align: right;">`;
                        let rows = child.getElementsByTagNameNS("*", "tr");
                        
                        for (let tr of rows) {
                            tableHtml += `<tr dir="rtl">`;
                            let cells = tr.getElementsByTagNameNS("*", "tc");
                            for (let tc of cells) {
                                let cellHtml = "";
                                let cellParas = tc.getElementsByTagNameNS("*", "p");
                                for (let cp of cellParas) {
                                    let cpText = parseParagraphContent(cp);
                                    if (cpText.trim() !== "") {
                                        cellHtml += `<div dir="rtl" style="margin-bottom: 4px; text-align: right; direction: rtl;">${cpText}</div>`;
                                    }
                                }
                                tableHtml += `<td dir="rtl" style="border: 1px solid #cbd5e1; padding: 10px; text-align: right; direction: rtl; vertical-align: middle;">${cellHtml}</td>`;
                            }
                            tableHtml += `</tr>`;
                        }
                        tableHtml += `</table>`;
                        finalHtml += tableHtml;
                    }
                }

                let wrappedHtml = `<div dir="rtl" style="text-align: right; direction: rtl; line-height: 1.8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">${finalHtml}</div>`;

                document.getElementById('new-lesson-content').value = wrappedHtml;
                document.getElementById('new-lesson-title').value = file.name.replace(/\.[^/.]+$/, "");
                previewMathContent();
                
                alert('تم استيراد ملف Word بنجاح مع الحفاظ على الألوان الأصلية، الأسس، والاتجاه RTL!');

            } catch (err) {
                alert('خطأ أثناء قراءة ملف Word: ' + err.message);
            }
        }

        // معالجة ملفات PDF .pdf الجديدة
        async function handlePdfUpload(file) {
            try {
                let arrayBuffer = await file.arrayBuffer();
                let loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                let pdfDoc = await loadingTask.promise;
                let extractedText = "";

                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    let page = await pdfDoc.getPage(i);
                    let textContent = await page.getTextContent();
                    let pageText = textContent.items.map(item => item.str).join(" ");
                    extractedText += `<p dir="rtl" style="margin-bottom: 12px; text-align: right; direction: rtl;">${pageText}</p>`;
                }

                let wrappedHtml = `<div dir="rtl" style="text-align: right; direction: rtl; line-height: 1.8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">${extractedText}</div>`;

                document.getElementById('new-lesson-content').value = wrappedHtml;
                document.getElementById('new-lesson-title').value = file.name.replace(/\.[^/.]+$/, "");
                previewMathContent();

                alert('تم استيراد ملف PDF بنجاح واستخراج نصوصه باتجاه RTL!');

            } catch (err) {
                alert('خطأ أثناء قراءة ملف PDF: ' + err.message);
            }
        }
        /* ========================================================================== */

        function exportJSON() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "taha_math_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importJSON(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(event) {
                try {
                    appData = JSON.parse(event.target.result);
                    localStorage.setItem('taha_math_platform_data', JSON.stringify(appData));
                    initAdmin();
                    alert('تم استعادة البيانات بنجاح!');
                } catch(err) { alert('ملف النسخة الاحتياطية غير صالح.'); }
            };
            reader.readAsText(file);
        }

        initAdmin();
    </script>
